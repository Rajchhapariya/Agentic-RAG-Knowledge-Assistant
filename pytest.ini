[pytest]
# ---------------------------------------------------------------------------
# pytest.ini — Test Suite Configuration
# ---------------------------------------------------------------------------
# Default run:    pytest           → runs ONLY fast, offline, deterministic tests
# Integration:    pytest -m integration → runs tests requiring real OpenAI API calls
# All tests:      pytest -m ""          → runs everything (use sparingly)
#
# IMPORTANT: The default run makes ZERO external OpenAI API calls.
# Tests marked @pytest.mark.integration require network access + API credentials.
# ---------------------------------------------------------------------------

markers =
    integration: Tests that require a live OpenAI API key and make real external API calls.
                 NEVER run automatically in CI or default pytest. Use: pytest -m integration

# Exclude integration tests by default. This enforces zero-API-call offline safety.
addopts = -m "not integration" -v --tb=short

testpaths = tests
